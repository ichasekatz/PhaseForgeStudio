[project]
name = "phaseforge-studio"
version = "0.1.0"
description = "Browser-based dashboard for MaterialsFramework / BLADE / PhaseForge pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Chase Katz", email = "ichasekatz@tamu.edu" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Programming Language :: Python",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.20",
]
hpc = [
    "numpy>=2.0",
    "ase>=3.23",
    "pycalphad>=0.11",
    "matplotlib>=3.9",
    "Pillow>=10.0",
    "pymatgen>=2024.0",
]

[project.urls]
Homepage = "https://github.com/ichasekatz/PhaseForgeStudio"
Issues = "https://github.com/ichasekatz/PhaseForgeStudio/issues"
Repository = "https://github.com/ichasekatz/PhaseForgeStudio.git"

[project.scripts]
phaseforge-studio = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phaseforge_studio"]
include = ["server.py", "index.html", "config.json.example"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PL",  # pylint
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",    # line too long
    "ERA001",  # commented-out code
    "PLC0415", # import not at top-level
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value in comparison
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests that require external services",
]
